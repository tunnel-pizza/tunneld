x-volumes: &volumes
  - /var/run/docker.sock:/var/run/docker.sock:ro
  - tunneld:/var/run/.tunneld
  - home:/home/user

services:
  tunneld:
    build:
      context: ./tunneld
      dockerfile: Dockerfile
    hostname: tunneld
    ipc: shareable
    volumes: *volumes
    environment:
      - TUNNELD_LOG=debug
      # Where the spec cache lands. tunneld files it under the user's cache
      # directory, which on Linux is $XDG_CACHE_HOME — this image has no
      # $HOME to fall back to — so the named volume above is mounted at the
      # .tunneld it makes inside that, and the hostname survives a restart.
      - XDG_CACHE_HOME=/var/run
      - TUNNELD_ORIGINS=http+ws://localhost:14500,attach://dockerd/terminal

  google-chrome:
    image: ghcr.io/cnuss/google-chrome:latest
    network_mode: service:tunneld
    pid: service:tunneld
    ipc: service:tunneld
    volumes: *volumes

  terminal:
    # image: ghcr.io/cnuss/zsh:latest
    image: ghcr.io/cnuss/zsh:latest
    network_mode: service:tunneld
    pid: service:tunneld
    ipc: service:tunneld
    stdin_open: true
    tty: true
    volumes: *volumes

volumes:
  tunneld: {}
  home: {}

