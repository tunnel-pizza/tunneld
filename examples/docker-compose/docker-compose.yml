
x-volumes: &volumes
  - /var/run/docker.sock:/var/run/docker.sock:ro
  - tunneld:/var/run/tunneld
  - home:/home/user

services:
  tunneld:
    build:
      context: ./tunneld
      dockerfile: Dockerfile
    hostname: tunneld
    ipc: shareable
    volumes: *volumes
    environment:
      - TUNNELD_LOG=debug
      - TUNNELD_CACHE_DIR=/var/run/tunneld
      - TUNNELD_ORIGINS=http+ws://localhost:14500,dockerd://terminal

  google-chrome:
    image: ghcr.io/cnuss/google-chrome:latest
    network_mode: service:tunneld
    pid: service:tunneld
    ipc: service:tunneld
    volumes: *volumes

  terminal:
    image: ghcr.io/cnuss/zsh:latest
    network_mode: service:tunneld
    pid: service:tunneld
    ipc: service:tunneld
    stdin_open: true
    tty: true
    volumes: *volumes

volumes:
  tunneld: {}
  home: {}

