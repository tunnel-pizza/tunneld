<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{.Host}} · multiview</title>

<!-- Basecoat (Vega): shadcn/ui's components and design tokens as plain CSS, no
     framework. Vega is the package's default theme — basecoat.cdn.min.css is
     byte-identical — so it is named here explicitly rather than inherited. Pinned by version and checked by digest, so a change at the CDN
     cannot silently alter what a tunnel serves.

     Dark, because the tiles frame other people's pages and most of those are
     light: a dark shell keeps the boundary between chrome and content legible
     instead of letting the two bleed together. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat-vega.cdn.min.css"
      integrity="sha384-XWKdrxzE2X33lI8Q03C9fIbqdLWV11whVNycR2/3bMNJY73EEQOa7rmN+SeiSCor"
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js"
        integrity="sha384-rD2ZCuReXV7nIneJcn1lsTn6yOv87YARLQyUsemVAxrYYHdy5hcAW8XZEQxx87Dj"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        defer></script>

<style>
  /* Layout only. Every colour, border, radius and typeface comes from
     Basecoat; the CDN build ships component classes without Tailwind's
     utilities, so the arrangement below is the part no class can supply. */

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .375rem .625rem;
  }

  /* The route link labels the tile; it should not outshout the page inside
     it, and the CDN build has no quiet button variant to reach for. */
  header a {
    margin-left: auto;
    color: var(--muted-foreground);
    text-decoration: none;
  }

  header a:hover,
  header a:focus-visible { color: var(--foreground); }

  .muted { color: var(--muted-foreground); }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    flex: 1;
    min-height: 0;
    padding: 0 .5rem .5rem;

    /* Load-bearing, though it is also the initial value: a wrapped flex
       container with a definite height hands its leftover space to the flex
       lines equally. Every tile has the same base height, so the rows come out
       even without anyone counting them. */
    align-content: stretch;
  }

  /* Two columns. The height is left to align-content above rather than
     calculated from a row count, which keeps the server out of the layout. */
  .tile {
    position: relative;  /* the label strip is positioned against this */
    flex: 1 1 calc(50% - .25rem);
    min-width: 0;      /* let a tile shrink past its iframe's intrinsic width */

    /* A card spaces its own children; a tile's child is a full-bleed iframe,
       so the padding and gap would only frame it in dead space. */
    gap: 0;
    padding-block: 0;
  }

  /* An odd number of origins: the last tile takes the whole final row. */
  .tile:nth-child(odd):last-child { flex-basis: 100%; }

  /* The label strip floats over its own frame rather than taking a band of
     the tile, which is the difference between a frame that fits a page and one
     that clips it. Translucent and blurred so it stays legible over whatever
     the origin happens to be serving underneath. */
  .tile header {
    position: absolute;
    inset: 0 0 auto 0;
    z-index: 1;
    /* Opaque enough that the muted label text keeps its contrast over a white
       page underneath, translucent enough to still read as an overlay. */
    background: color-mix(in oklab, var(--card) 88%, transparent);
    border-bottom: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
  }

  .tile iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    background: #fff; /* most origins are light; don't flash the shell's ink */
  }

  /* Narrow: one column, and let the page scroll rather than crush the tiles. */
  @media (max-width: 45rem) {
    body { overflow: auto; }
    .grid { flex: none; align-content: flex-start; }
    .tile { flex-basis: 100%; height: 70dvh; }
  }
</style>
</head>
<body>

<header>
  <span class="badge">{{.Host}}</span>
  <span class="muted">{{len .Origins}} origins</span>
</header>

<main class="grid">
  {{- range .Origins}}
  <section class="card tile">
    <header>
      <span class="badge">{{.Index}}</span>
      <span class="muted">{{.Local}}</span>
      <a href="{{.Route}}" target="_blank" rel="noopener">{{.Route}} &#8599;</a>
    </header>
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- end}}
</main>

</body>
</html>
