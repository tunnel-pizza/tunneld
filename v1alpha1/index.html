<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{.Host}} · multiview</title>

<!-- Basecoat (Lyra): shadcn/ui's components and design tokens as plain CSS, no
     framework. Pinned by version and checked by digest, so a change at the CDN
     cannot silently alter what a tunnel serves.

     Dark, because the tiles frame other people's pages and most of those are
     light: a dark shell keeps the boundary between chrome and content legible
     instead of letting the two bleed together. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat-lyra.cdn.min.css"
      integrity="sha384-lbWbDDZc0lBRulCtOY3TsBD/aqRxsW0E2fSB4SdB92ulxl6EJTh4CYpNEojYQEWE"
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js"
        integrity="sha384-rD2ZCuReXV7nIneJcn1lsTn6yOv87YARLQyUsemVAxrYYHdy5hcAW8XZEQxx87Dj"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        defer></script>

<style>
  /* Layout only. Every colour, border, radius and typeface comes from
     Basecoat; the CDN build ships component classes without Tailwind's
     utilities, so the arrangement below is the part no class can supply. */

  html, body { height: 100%; margin: 0; }

  body { overflow: hidden; }

  /* The grid is the whole page: the frames are the content, and a bar naming
     the host only repeated what the tab title already says. */
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem;
    height: 100%;
    padding: .25rem;

    /* Load-bearing, though it is also the initial value: a wrapped flex
       container with a definite height hands its leftover space to the flex
       lines equally. Every tile has the same base height, so the rows come out
       even without anyone counting them. */
    align-content: stretch;
  }

  /* Two columns. The height is left to align-content above rather than
     calculated from a row count, which keeps the server out of the layout. */
  .tile {
    position: relative;  /* the label strip is positioned against this */
    flex: 1 1 calc(50% - .125rem);  /* half the gap, so two tiles fit a row */
    min-width: 0;      /* let a tile shrink past its iframe's intrinsic width */

    /* A card spaces its own children; a tile's child is a full-bleed iframe,
       so the padding and gap would only frame it in dead space. */
    gap: 0;
    padding-block: 0;
  }

  /* An odd number of origins: the last tile takes the whole final row. */
  .tile:nth-child(odd):last-child { flex-basis: 100%; }

  /* One control per tile, in the corner: the index, the local address and the
     route repeated the same three facts on every frame, and the frame itself
     already says which service it is. What is left is the one thing the page
     cannot do for itself — open this origin on its own. It rests translucent
     so it never competes with the content, and comes forward on hover. */
  .tile > a {
    position: absolute;
    top: .375rem;
    right: .375rem;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 1.625rem;
    height: 1.625rem;
    padding: 0;
    opacity: .45;
    color: var(--card-foreground);
    background: color-mix(in oklab, var(--card) 72%, transparent);
    border-color: color-mix(in oklab, var(--border) 60%, transparent);
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
    transition: opacity .15s ease, background-color .15s ease;
  }

  .tile > a:hover,
  .tile > a:focus-visible {
    opacity: 1;
    background: var(--card);
  }

  .tile > a svg {
    width: .8125rem;
    height: .8125rem;
  }

  .tile iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    background: #fff; /* most origins are light; don't flash the shell's ink */
  }

  /* Narrow: one column, and let the page scroll rather than crush the tiles. */
  @media (max-width: 45rem) {
    body { overflow: auto; }
    .grid { height: auto; align-content: flex-start; }
    .tile { flex-basis: 100%; height: 70dvh; }
  }
</style>
</head>
<body>

<main class="grid">
  {{- range .Origins}}
  <section class="card tile">
    <!-- The label the strip used to carry lives in the tooltip now: present
         when someone goes looking, invisible the rest of the time. -->
    <a class="btn" href="{{.Route}}" target="_blank" rel="noopener"
       title="Open {{.Local}} ({{.Route}}) in a new tab"
       aria-label="Open {{.Local}} in a new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6"/>
        <path d="M10 14 21 3"/>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/>
      </svg>
    </a>
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- end}}
</main>

</body>
</html>
