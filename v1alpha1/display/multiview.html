<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{.Host}} · multiview</title>

<!-- Basecoat (Lyra): shadcn/ui's components and design tokens as plain CSS, no
     framework. Pinned by version and checked by digest, so a change at the CDN
     cannot silently alter what a tunnel serves.

     Dark, because the tiles frame other people's pages and most of those are
     light: a dark shell keeps the boundary between chrome and content legible
     instead of letting the two bleed together. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat-lyra.cdn.min.css"
      integrity="sha384-lbWbDDZc0lBRulCtOY3TsBD/aqRxsW0E2fSB4SdB92ulxl6EJTh4CYpNEojYQEWE"
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js"
        integrity="sha384-rD2ZCuReXV7nIneJcn1lsTn6yOv87YARLQyUsemVAxrYYHdy5hcAW8XZEQxx87Dj"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        defer></script>

<style>
  /* Layout only. Every colour, border, radius and typeface comes from
     Basecoat; the CDN build ships component classes without Tailwind's
     utilities, so the arrangement below is the part no class can supply. */

  html, body { height: 100%; margin: 0; }

  /* A column so the strip and the grid stack rather than overlap: the strip
     takes the rows its messages need and the grid is handed whatever is
     left, below. */
  body { overflow: hidden; display: flex; flex-direction: column; }

  /* macOS hides overlay scrollbars until something moves, and when the page
     does overflow the bar is the only sign that more tiles exist below.
     Declaring one opts into the classic, always-visible kind. Blink and WebKit
     only; Firefox follows the OS setting and offers no way to override it. */
  body::-webkit-scrollbar { width: 10px; height: 10px; }
  body::-webkit-scrollbar-track { background: transparent; }
  body::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--muted-foreground) 55%, transparent);
  }
  body::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
  body::-webkit-scrollbar-corner { background: transparent; }

  /* The provider's word, above the frames: a strip per message, centred,
     coloured by how loudly it was said. The grid takes what is left. */
  .motd { flex: none; display: flex; flex-direction: column; gap: .125rem; padding: .25rem .25rem 0; }
  .message { text-align: center; padding: .375rem .75rem; border-radius: .375rem; border: 1px solid var(--border); background: var(--card); color: var(--card-foreground); }
  .message p { margin: 0; }
  .message a { color: inherit; text-decoration: underline; }
  .message-warning { border-color: oklch(80% .17 80); }
  .message-note { border-color: oklch(70% .15 230); }
  .message-caution { border-color: oklch(60% .22 25); }

  /* The grid is the rest of the page: the frames are the content, and a bar
     naming the host only repeated what the tab title already says. */
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem;
    /* Was height: 100% back when the grid was the whole page; now the strip
       above it may take a row of its own, so the grid takes whatever height
       is left instead of assuming it owns the body. */
    flex: 1;
    min-height: 0;
    padding: .25rem;

    /* Load-bearing, though it is also the initial value: a wrapped flex
       container with a definite height hands its leftover space to the flex
       lines equally. Every tile has the same base height, so the rows come out
       even without anyone counting them. */
    align-content: stretch;
  }

  /* Two columns. The height is left to align-content above rather than
     calculated from a row count, which keeps the server out of the layout. */
  .tile {
    position: relative;  /* the label strip is positioned against this */
    flex: 1 1 calc(50% - .125rem);  /* half the gap, so two tiles fit a row */
    min-width: 0;      /* let a tile shrink past its iframe's intrinsic width */

    /* A card spaces its own children; a tile's child is a full-bleed iframe,
       so the padding and gap would only frame it in dead space. */
    gap: 0;
    padding-block: 0;
  }

  /* An odd number of origins: the last tile takes the whole final row. */
  .tile:nth-child(odd):last-child { flex-basis: 100%; }

  /* Three controls per tile, in the corner: the index, the local address and
     the route repeated the same three facts on every frame, and the frame
     itself already says which service it is. What is left is what the page
     cannot do for itself — step this one frame back, reload it, and open this
     origin on its own.
     They rest translucent so they never compete with the content, and come
     forward on hover. */
  .tile > .controls {
    position: absolute;
    top: .375rem;
    right: .375rem;
    z-index: 1;
    display: flex;
    gap: .25rem;
  }

  .tile .controls > .btn {
    display: grid;
    place-items: center;
    width: 1.625rem;
    height: 1.625rem;
    padding: 0;
    opacity: .45;
    color: var(--card-foreground);
    background: color-mix(in oklab, var(--card) 72%, transparent);
    border-color: color-mix(in oklab, var(--border) 60%, transparent);
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
    transition: opacity .15s ease, background-color .15s ease;
  }

  .tile .controls > .btn:hover,
  .tile .controls > .btn:focus-visible {
    opacity: 1;
    background: var(--card);
  }

  /* Basecoat gives .btn a display of its own, which would outrank the
     browser's [hidden] rule; the hidden back button has to actually go. */
  .tile .controls > .btn[hidden] { display: none; }

  .tile .controls svg {
    width: .8125rem;
    height: .8125rem;
  }

  /* The reload turns while the frame is loading, so a press on a slow origin
     is seen to have done something; it stops when the frame says it is back. */
  @keyframes turn { to { transform: rotate(360deg); } }
  .tile .controls > .busy svg { animation: turn .8s linear infinite; }

  .tile iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
  }

  /* Narrow: one column, still dividing the viewport rather than scrolling —
     two origins get half each, three a third each, the same way the rows do
     when there is room for two columns.

     The min-height is where that stops: past a certain number of origins an
     equal share is too small to read, so the tiles hold their size and the
     page scrolls instead. body may scroll here for that reason alone. */
  @media (max-width: 45rem) {
    body { overflow: auto; }
    .tile { flex-basis: 100%; min-height: 12rem; }
  }
</style>
</head>
<body>

{{- if .Messages}}
<header class="motd">
  {{- range .Messages}}
  <div class="message message-{{.Severity}}">{{.HTML}}</div>
  {{- end}}
</header>
{{- end}}
<main class="grid">
  {{- range .Origins}}
  <section class="card tile">
    <!-- The label the strip used to carry lives in the tooltip now: present
         when someone goes looking, invisible the rest of the time. -->
    <div class="controls">
      <button class="btn" type="button" data-back
              title="Back, in {{.Local}} ({{.Route}})"
              aria-label="Back, in {{.Local}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
      </button>
      <button class="btn" type="button" data-reload
              title="Reload {{.Local}} ({{.Route}})"
              aria-label="Reload {{.Local}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
      <a class="btn" href="{{.Route}}" target="_blank" rel="noopener"
         title="Open {{.Local}} ({{.Route}}) in a new tab"
         aria-label="Open {{.Local}} in a new tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"/>
          <path d="M10 14 21 3"/>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/>
        </svg>
      </a>
    </div>
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- end}}
</main>

<script>
  // Give a tile focus when it is clicked.
  //
  // The browser normally does this itself: a click inside a frame focuses that
  // frame. It does it as the default action of the mousedown, though, so an
  // origin that calls preventDefault on mousedown cancels the focus along with
  // whatever else it was suppressing. Plenty do — xpra's HTML5 client is the
  // one that surfaced this, forwarding the click to a remote desktop and
  // wanting none of the browser's own handling. Standalone that costs nothing,
  // because there is nothing else to focus. In a panel it means the tile can
  // never take the keyboard, and every keystroke keeps going to whichever tile
  // had it last, which reads as the wrong window being typed into.
  //
  // So the panel focuses the frame itself, in the capture phase, before the
  // origin's handler runs and regardless of what it does afterwards. Every
  // frame here is the tunnel's own hostname, so reaching into one is
  // same-origin and allowed; the try/catch is for the case where it somehow is
  // not, where the old behaviour is the right thing to fall back to.
  //
  // On load rather than once, because a frame that navigates — an origin
  // redirecting, or reconnecting — replaces the window this was attached to.
  //
  // The same reach into the frame is what keeps a bare page legible. A page
  // with no CSS at all — a bare "hello", anything a stock dev server hands
  // out without a stylesheet — renders in the browser's light defaults:
  // black text on a canvas it never painted, which is the tile's dark card
  // showing through. Telling that document it is dark switches the defaults
  // it was already using and nothing else. A page that chose anything — a
  // stylesheet, a style element, a style attribute, a color-scheme meta — is
  // left exactly as it is; its colours are its own, and the browser lays it
  // on the card the way it lays any framed page.
  const paint = (frame) => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      if (doc.querySelector('meta[name="color-scheme"], style, link[rel~="stylesheet"], [style]')) return;
      doc.documentElement.style.colorScheme = 'dark';
    } catch (e) { /* cross-origin: its colours are its own */ }
  };
  for (const frame of document.querySelectorAll('.tile iframe')) {
    const wire = () => {
      try {
        frame.contentWindow.addEventListener(
          'pointerdown', () => frame.contentWindow.focus(), true);
      } catch (e) { /* cross-origin: leave the browser's default alone */ }
      paint(frame);
    };
    frame.addEventListener('load', wire);
    wire(); // a frame that is already there when this runs
  }

  // Reload one frame. It reloads where it is, not back at the route it began
  // on: a page that navigated somewhere and stayed is what the tile shows,
  // and what is stale. A reload revalidates the document the way the
  // browser's own reload does; the browser scopes nothing harder to a frame,
  // and the page's subresources keep whatever caching it gave them, as they
  // would at the top level. A frame whose window cannot be read — it left the
  // origin — is pointed at its route again, which is all that can be done.
  const reload = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile && tile.querySelector('[data-reload]');
    if (button) button.classList.add('busy');
    const again = () => { frame.src = frame.getAttribute('src'); };
    let win, href;
    try { win = frame.contentWindow; href = win.location.href; } catch (e) { win = null; }
    if (!win || href === 'about:blank') return again();
    try { win.location.reload(); } catch (e) { again(); }
  };
  // Step one frame back — and only within that frame's own history. A
  // frame's history.back() walks the page's joint history, the same walk the
  // browser's back button takes, and with nothing of the frame's to step to
  // it leaves the panel instead: pressed on a fresh tile it lands the tab on
  // whatever came before. So the button only fires when the frame has an
  // entry of its own behind it, and is hidden the rest of the time: a tile
  // that has gone nowhere shows nothing to go back to.
  //
  // The Navigation API knows exactly that, per frame and pushState included.
  // Where it is missing the frame's loads are counted instead: one up per
  // load the button did not cause, one down per back. In-page routing goes
  // uncounted there, which leaves the button inert rather than wrong.
  const back = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile.querySelector('[data-back]');
    let depth = 0;
    let expected = false; // the next load is one the button caused
    const can = () => {
      try {
        const nav = frame.contentWindow.navigation;
        return nav ? nav.canGoBack : depth > 0;
      } catch (e) { return false; }
    };
    const show = () => { button.hidden = !can(); };
    button.addEventListener('click', () => {
      if (!can()) return;
      expected = true;
      depth = Math.max(0, depth - 1);
      try { frame.contentWindow.history.back(); } catch (e) { expected = false; }
    });
    tile.querySelector('[data-reload]').addEventListener('click', () => { expected = true; });
    // A frame that finished loading before this ran has had its first load:
    // counting the next one as it would count a fresh page's first load
    // swallows a real step. One that cannot be read has certainly loaded.
    let first = true;
    try {
      const doc = frame.contentDocument;
      first = !(doc && doc.readyState === 'complete' && frame.contentWindow.location.href !== 'about:blank');
    } catch (e) { first = false; }
    frame.addEventListener('load', () => {
      if (first) first = false;
      else if (expected) expected = false;
      else depth++;
      try {
        frame.contentWindow.navigation?.addEventListener('currententrychange', show);
      } catch (e) { /* left the origin: nothing to count */ }
      show();
    });
    show();
  };
  for (const frame of document.querySelectorAll('.tile iframe')) back(frame);
  for (const button of document.querySelectorAll('.tile [data-reload]')) {
    const frame = button.closest('.tile').querySelector('iframe');
    button.addEventListener('click', () => reload(frame));
    frame.addEventListener('load', () => button.classList.remove('busy'));
  }
</script>

</body>
</html>
