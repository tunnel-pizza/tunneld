<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{.Host}} multiview</title>

<!-- The panel is tunnel.pizza's own switchboard, and it dresses the way the
     site does: one console face for everything, the warm greys of a printed
     board, edges cut rather than rounded, no shadows, and emphasis by
     contrast alone. The font is the only thing fetched; the rest is here,
     so nothing at a CDN can change what a tunnel serves. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap">

<style>
  /* Radix sand, dark: the site's own greys. A tile's rail is one step up
     from the page, a hairline two steps up separates everything, and text
     is either quiet or full — there is no accent colour on this board. The
     three severity colours are the provider's, not ours, and appear only
     when it speaks. */
  :root {
    --sand-1: #111110;
    --sand-2: #191918;
    --sand-3: #222221;
    --sand-6: #3b3a37;
    --sand-8: #62605b;
    --sand-11: #b5b3ad;
    --sand-12: #eeeeec;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--sand-1);
    color: var(--sand-12);
    font-family: var(--mono);
    font-size: .75rem;
    line-height: 1.4;
  }
  :focus-visible { outline: 2px solid var(--sand-11); outline-offset: -2px; }

  /* macOS hides overlay scrollbars until something moves, and when the page
     does overflow the bar is the only sign that more tiles exist below.
     Declaring one opts into the classic, always-visible kind. Blink and WebKit
     only; Firefox follows the OS setting and offers no way to override it. */
  body::-webkit-scrollbar { width: 10px; height: 10px; }
  body::-webkit-scrollbar-track { background: transparent; }
  body::-webkit-scrollbar-thumb { background: var(--sand-6); }
  body::-webkit-scrollbar-thumb:hover { background: var(--sand-8); }
  body::-webkit-scrollbar-corner { background: transparent; }

  /* The provider's word, above the board: one bar per message, solid in the
     colour of how loudly it was said, text in the inverse so it reads on the
     fill. Edge to edge and stacked flush, so several read as one notice bar
     rather than as cards. The same bar the terminal frame draws in its top
     row, in the same three colours. A message with no severity is a quiet
     bar in the board's own grey. */
  .motd { flex: none; display: flex; flex-direction: column; }
  .message {
    text-align: center;
    padding: .2rem .75rem;
    background: var(--sand-3);
    color: var(--sand-12);
  }
  .message p { display: inline; margin: 0; }
  .message .label { font-weight: 700; margin-right: .5ch; }
  .message a { color: inherit; text-decoration: underline; text-underline-offset: .15em; }
  .message-note    { background: oklch(70% .15 230); color: oklch(15% 0 0); }
  .message-warning { background: oklch(80% .17 80);  color: oklch(15% 0 0); }
  .message-caution { background: oklch(60% .22 25);  color: oklch(98% 0 0); }

  /* The board: tiles set in a hairline grid, two across. The gap is the
     board showing through, which is what draws the lines; no tile has a
     border of its own to double up at a seam. A wrapped flex container with
     a definite height hands its leftover space to the rows equally, so the
     rows come out even without anyone counting them. */
  .grid {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: stretch;
    gap: 1px;
    padding: 1px;
    background: var(--sand-6);
  }
  .tile {
    flex: 1 1 calc(50% - 1px);
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--sand-1);
  }
  /* An odd number of origins: the last tile takes the whole final row. */
  .tile:nth-child(odd):last-child { flex-basis: 100%; }

  /* The rail: one line above each frame that says what this bay is
     patched to — the routing index, then the local address it reaches — and
     holds the three things the page can do for the frame. It is the console
     idea of a window title, and like a console it shows which window has
     the keyboard: the tile that does wears its rail inverted, full text on
     no ground, so a keystroke's destination is never a guess. */
  .rail {
    flex: none;
    display: flex;
    align-items: center;
    gap: 1ch;
    height: 1.625rem;
    padding: 0 .25rem 0 .75rem;
    background: var(--sand-2);
    color: var(--sand-11);
    white-space: nowrap;
  }
  .rail .index { font-weight: 700; color: var(--sand-12); }
  .rail .local { overflow: hidden; text-overflow: ellipsis; }
  .tile.active .rail { background: var(--sand-12); color: var(--sand-1); }
  .tile.active .rail .index { color: var(--sand-1); }

  .controls { margin-left: auto; display: flex; }
  .ctl {
    display: grid;
    place-items: center;
    width: 1.625rem;
    height: 1.625rem;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    opacity: .7;
  }
  .ctl:hover, .ctl:focus-visible { opacity: 1; }
  .ctl[hidden] { display: none; }
  .ctl svg { width: .875rem; height: .875rem; }

  /* The reload turns while the frame is loading, so a press on a slow origin
     is seen to have done something; it stops when the frame says it is back.
     The one motion on the page, and it answers a press. */
  @keyframes turn { to { transform: rotate(360deg); } }
  .ctl.busy svg { animation: turn .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .ctl.busy svg { animation: none; opacity: .4; } }

  .tile iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    background: var(--sand-1);
  }

  /* Narrow: one column, still dividing the viewport rather than scrolling —
     two origins get half each, three a third each, the same way the rows do
     when there is room for two columns.

     The min-height is where that stops: past a certain number of origins an
     equal share is too small to read, so the tiles hold their size and the
     page scrolls instead. body may scroll here for that reason alone. */
  @media (max-width: 45rem) {
    body { overflow: auto; }
    .tile { flex-basis: 100%; min-height: 14rem; }
  }
</style>
</head>
<body>

{{- if .Messages}}
<header class="motd">
  {{- range .Messages}}
  <div class="message message-{{.Severity}}">{{if .Severity}}<span class="label">{{.Label}}</span> {{end}}{{.HTML}}</div>
  {{- end}}
</header>
{{- end}}
<main class="grid">
  {{- range .Origins}}
  <section class="tile">
    <div class="rail">
      <span class="index">{{.Route}}</span>
      <span class="local">{{.Local}}</span>
      <div class="controls">
        <button class="ctl" type="button" data-back
                title="Back, in {{.Local}}"
                aria-label="Back, in {{.Local}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
        </button>
        <button class="ctl" type="button" data-reload
                title="Reload {{.Local}}"
                aria-label="Reload {{.Local}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
        </button>
        <a class="ctl" href="{{.Route}}" target="_blank" rel="noopener"
           title="Open {{.Local}} in a new tab"
           aria-label="Open {{.Local}} in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6"/>
            <path d="M10 14 21 3"/>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/>
          </svg>
        </a>
      </div>
    </div>
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- end}}
</main>

<script>
  // Give a tile focus when it is clicked, and show which one has it.
  //
  // The browser normally does this itself: a click inside a frame focuses that
  // frame. It does it as the default action of the mousedown, though, so an
  // origin that calls preventDefault on mousedown cancels the focus along with
  // whatever else it was suppressing. Plenty do — xpra's HTML5 client is the
  // one that surfaced this, forwarding the click to a remote desktop and
  // wanting none of the browser's own handling. Standalone that costs nothing,
  // because there is nothing else to focus. In a panel it means the tile can
  // never take the keyboard, and every keystroke keeps going to whichever tile
  // had it last, which reads as the wrong window being typed into.
  //
  // So the panel focuses the frame itself, in the capture phase, before the
  // origin's handler runs and regardless of what it does afterwards, and
  // marks the tile so its rail inverts: the console's way of saying which
  // window the keyboard belongs to. Every frame here is the tunnel's own
  // hostname, so reaching into one is same-origin and allowed; the try/catch
  // is for the case where it somehow is not, where the old behaviour is the
  // right thing to fall back to.
  //
  // On load rather than once, because a frame that navigates — an origin
  // redirecting, or reconnecting — replaces the window this was attached to.
  //
  // The same reach into the frame is what keeps a bare page legible. A page
  // with no CSS at all — a bare "hello", anything a stock dev server hands
  // out without a stylesheet — renders in the browser's light defaults:
  // black text on a canvas it never painted, which is the board showing
  // through. Telling that document it is dark switches the defaults it was
  // already using and nothing else. A page that chose anything — a
  // stylesheet, a style element, a style attribute, a color-scheme meta — is
  // left exactly as it is; its colours are its own.
  const tiles = [...document.querySelectorAll('.tile')];
  const activate = (tile) => {
    for (const t of tiles) t.classList.toggle('active', t === tile);
  };
  const paint = (frame) => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      if (doc.querySelector('meta[name="color-scheme"], style, link[rel~="stylesheet"], [style]')) return;
      doc.documentElement.style.colorScheme = 'dark';
    } catch (e) { /* cross-origin: its colours are its own */ }
  };
  for (const frame of document.querySelectorAll('.tile iframe')) {
    const tile = frame.closest('.tile');
    const wire = () => {
      try {
        frame.contentWindow.addEventListener(
          'pointerdown', () => { frame.contentWindow.focus(); activate(tile); }, true);
        frame.contentWindow.addEventListener('focus', () => activate(tile));
      } catch (e) { /* cross-origin: leave the browser's default alone */ }
      paint(frame);
    };
    frame.addEventListener('load', wire);
    wire(); // a frame that is already there when this runs
  }
  // A click on a rail hands the keyboard to its frame too: the rail is the
  // window's title, and a title bar is what you click to bring a window up.
  for (const tile of tiles) {
    tile.querySelector('.rail').addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ctl')) return;
      try { tile.querySelector('iframe').contentWindow.focus(); } catch (err) { /* nothing to focus */ }
      activate(tile);
    });
  }

  // Reload one frame. It reloads where it is, not back at the route it began
  // on: a page that navigated somewhere and stayed is what the tile shows,
  // and what is stale. A reload revalidates the document the way the
  // browser's own reload does; the browser scopes nothing harder to a frame,
  // and the page's subresources keep whatever caching it gave them, as they
  // would at the top level. A frame whose window cannot be read — it left the
  // origin — is pointed at its route again, which is all that can be done.
  const reload = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile && tile.querySelector('[data-reload]');
    if (button) button.classList.add('busy');
    const again = () => { frame.src = frame.getAttribute('src'); };
    let win, href;
    try { win = frame.contentWindow; href = win.location.href; } catch (e) { win = null; }
    if (!win || href === 'about:blank') return again();
    try { win.location.reload(); } catch (e) { again(); }
  };
  // Step one frame back — and only within that frame's own history. A
  // frame's history.back() walks the page's joint history, the same walk the
  // browser's back button takes, and with nothing of the frame's to step to
  // it leaves the panel instead: pressed on a fresh tile it lands the tab on
  // whatever came before. So the button only fires when the frame has an
  // entry of its own behind it, and is hidden the rest of the time: a tile
  // that has gone nowhere shows nothing to go back to.
  //
  // The Navigation API knows exactly that, per frame and pushState included.
  // Where it is missing the frame's loads are counted instead: one up per
  // load the button did not cause, one down per back. In-page routing goes
  // uncounted there, which leaves the button inert rather than wrong.
  const back = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile.querySelector('[data-back]');
    let depth = 0;
    let expected = false; // the next load is one the button caused
    const can = () => {
      try {
        const nav = frame.contentWindow.navigation;
        return nav ? nav.canGoBack : depth > 0;
      } catch (e) { return false; }
    };
    const show = () => { button.hidden = !can(); };
    button.addEventListener('click', () => {
      if (!can()) return;
      expected = true;
      depth = Math.max(0, depth - 1);
      try { frame.contentWindow.history.back(); } catch (e) { expected = false; }
    });
    tile.querySelector('[data-reload]').addEventListener('click', () => { expected = true; });
    // A frame that finished loading before this ran has had its first load:
    // counting the next one as it would count a fresh page's first load
    // swallows a real step. One that cannot be read has certainly loaded.
    let first = true;
    try {
      const doc = frame.contentDocument;
      first = !(doc && doc.readyState === 'complete' && frame.contentWindow.location.href !== 'about:blank');
    } catch (e) { first = false; }
    frame.addEventListener('load', () => {
      if (first) first = false;
      else if (expected) expected = false;
      else depth++;
      try {
        frame.contentWindow.navigation?.addEventListener('currententrychange', show);
      } catch (e) { /* left the origin: nothing to count */ }
      show();
    });
    show();
  };
  for (const frame of document.querySelectorAll('.tile iframe')) back(frame);
  for (const button of document.querySelectorAll('.tile [data-reload]')) {
    const frame = button.closest('.tile').querySelector('iframe');
    button.addEventListener('click', () => reload(frame));
    frame.addEventListener('load', () => button.classList.remove('busy'));
  }
</script>

</body>
</html>
