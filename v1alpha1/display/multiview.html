<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>{{.Host}} multiview</title>

<!-- The panel looks like the terminal the frame draws, because that is what
     sits inside its tiles: xterm's own stylesheet, the same pinned copy the
     attach page loads, for the face and the metrics; the frame's palette for
     everything the stylesheet does not carry. One look across the tunnel,
     whether a page is a frame or a page of frames. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
      integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD"
      crossorigin="anonymous"
      referrerpolicy="no-referrer">

<style>
  /* The frame's colours, by their ANSI-256 index in frame.go: the border,
     the name of what is framed, the address that reaches it, the chips, and
     the three severities the provider speaks in. Black is the terminal's.
     The row is xterm's cell at 13px, so the panel's chrome and the frame's
     rows inside a tile fall on the same grid. */
  :root {
    --border: #87afff;   /* 111 */
    --name:   #00d7ff;   /* 45, bold */
    --addr:   #87d787;   /* 114 */
    --hint:   #8a8a8a;   /* 245 */
    --chip:   #ffaf00;   /* 214 */
    --ink:    #080808;   /* 232 */
    --paper:  #eeeeee;   /* 255 */
    --note:    #00d7ff;  /* 45 */
    --warning: #ffaf00;  /* 214 */
    --caution: #ff0000;  /* 196 */
    /* One cell of the terminal's grid. These are the panel's own guess for a
       page with no terminal on it; when a tile holds one, the script below
       reads the cell that terminal actually settled on and sets these, so a
       frame the panel draws and a frame the terminal draws share their rows
       and columns. --scrollbar is the width xterm's fit keeps for its bar. */
    --row: 15.85px;
    --col: 7.56px;
    --scrollbar: 15px;
    --font: monospace; /* what xterm draws with here; its own stack resolves to the same face */
  }

  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--paper);
    font: 13px/var(--row) var(--font);
  }
  :focus-visible { outline: 1px solid var(--paper); outline-offset: 1px; }

  /* macOS hides overlay scrollbars until something moves, and when the page
     does overflow the bar is the only sign that more tiles exist below.
     Declaring one opts into the classic, always-visible kind. Blink and WebKit
     only; Firefox follows the OS setting and offers no way to override it. */
  body::-webkit-scrollbar { width: 10px; height: 10px; }
  body::-webkit-scrollbar-track { background: transparent; }
  body::-webkit-scrollbar-thumb { background: #333; }
  body::-webkit-scrollbar-thumb:hover { background: var(--hint); }
  body::-webkit-scrollbar-corner { background: transparent; }

  /* The provider's word, in the bar the frame draws on its own top row: one
     row per message, solid in the colour of how loudly it was said, the
     text bold in the inverse. Edge to edge and stacked flush. */
  .motd { flex: none; display: flex; flex-direction: column; }
  .message {
    height: var(--row);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-align: center;
    padding: 0 1ch;
    font-weight: 700;
    background: #333;
    color: var(--paper);
  }
  .message p { display: inline; margin: 0; }
  .message .label { margin-right: 1ch; }
  .message a { color: inherit; text-decoration: underline; }
  .message-note    { background: var(--note);    color: var(--ink); }
  .message-warning { background: var(--warning); color: var(--ink); }
  .message-caution { background: var(--caution); color: var(--paper); }

  /* The board: two frames across, each the size the flex line hands it. A
     wrapped flex container with a definite height shares its leftover space
     between the lines, so the rows come out even without anyone counting. */
  .grid {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: stretch;
  }
  .tile {
    position: relative;
    box-sizing: border-box; /* the padding is the frame's chrome, inside the half */
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    /* One row above and below for the border and its labels, one column
       either side: the frame's own chrome, in the frame's own units. */
    padding: var(--row) 1ch;
  }
  /* An odd number of origins: the last tile takes the whole final row. */
  .tile:nth-child(odd):last-child { flex-basis: 100%; }

  /* The frame's rounded box, drawn as a border rather than as ╭─╮ cells so
     it stays continuous at any width. It is laid on the terminal's grid:
     the terminal beside it fits whole rows and columns into the same tile
     and draws its border in the last of each, so this one ends where that
     one does — half a cell in from the first row and column, and half a
     cell before the last whole one, with the remainder left dark below
     and to the right exactly as xterm leaves it. The tile that has the
     keyboard wears it in full white — a console's active pane. */
  .tile::before {
    content: "";
    position: absolute;
    top: calc(var(--row) / 2);
    left: calc(var(--col) / 2);
    width: calc(round(down, calc(100% - var(--scrollbar)), var(--col)) - var(--col));
    height: calc(round(down, 100%, var(--row)) - var(--row));
    border: 1px solid var(--border);
    border-radius: 6px;
    pointer-events: none;
  }
  .tile.active::before { border-color: var(--paper); }
  /* A terminal's tile is bare: the frame inside is its chrome. */
  .tile.bare { padding: 0; }
  .tile.bare::before { content: none; }
  .tile.bare iframe { width: 100%; margin: 0; }

  /* A label on the border: black behind it breaks the line, as the frame's
     text does, and a column of space either side keeps the line off the
     letters. Top left names what is framed; top right holds the page's
     controls for the frame, as chips in the frame's own orange — one text
     glyph each, in the frame's font and weight, because a terminal beside
     them draws the same chip as text and an icon next to a glyph never
     matches. */
  .edge {
    position: absolute;
    top: 0;
    left: calc(var(--col) * 2.5);
    width: calc(round(down, calc(100% - var(--scrollbar)), var(--col)) - var(--col) * 5);
    height: var(--row);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2ch;
    white-space: nowrap;
    pointer-events: none;
  }
  .edge > * { pointer-events: auto; }
  .edge .local, .edge .controls { background: #000; padding: 0 1ch; }
  .edge .local { color: var(--name); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

  .controls { display: flex; gap: var(--col); }
  .ctl {
    display: inline-block;
    width: calc(var(--col) * 3);
    height: var(--row);
    padding: 0;
    border: 0;
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    line-height: var(--row);
    text-align: center;
    cursor: pointer;
    text-decoration: none;
  }
  .ctl:hover, .ctl:focus-visible { background: var(--paper); }
  .ctl[hidden] { display: none; }

  /* The reload's glyph turns while the frame is loading, so a press on a
     slow origin is seen to have done something; it stops when the frame says
     it is back. The one motion on the page, and it answers a press. */
  @keyframes turn { to { transform: rotate(360deg); } }
  .ctl.busy { animation: turn .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .ctl.busy { animation: none; opacity: .5; } }

  /* The screen inside the frame: one row and one column in from the border,
     as the pane sits inside the frame's box. */
  .tile iframe {
    flex: 1;
    width: calc(100% - 2ch);
    min-height: 0;
    margin: 0 1ch;
    border: 0;
    background: #000;
  }

  /* Narrow: one column, still dividing the viewport rather than scrolling —
     two origins get half each, three a third each, the same way the rows do
     when there is room for two columns.

     The min-height is where that stops: past a certain number of origins an
     equal share is too small to read, so the tiles hold their size and the
     page scrolls instead. body may scroll here for that reason alone. */
  @media (max-width: 45rem) {
    body { overflow: auto; }
    .tile { flex-basis: 100%; min-height: 16rem; }
  }
</style>
</head>
<body>

{{- if .Messages}}
<header class="motd">
  {{- range .Messages}}
  <div class="message message-{{.Severity}}">{{if .Severity}}<span class="label">{{.Label}}</span> {{end}}{{.HTML}}</div>
  {{- end}}
</header>
{{- end}}
<main class="grid">
  {{- range .Origins}}
  {{- if .Terminal}}
  <!-- A terminal draws its own frame, labels and bar; the panel adds nothing
       around it but the space every tile gets. -->
  <section class="tile bare">
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- else}}
  <section class="tile">
    <div class="edge">
      <span class="local">{{.Local}}</span>
      <div class="controls">
        <button class="ctl" type="button" data-back aria-label="Back, in {{.Local}}">←</button>
        <button class="ctl" type="button" data-reload aria-label="Reload {{.Local}}">↻</button>
        <a class="ctl" href="{{.Route}}" target="_blank" rel="noopener"
           aria-label="Open {{.Local}} in a new tab">↗</a>
      </div>
    </div>
    <iframe src="{{.Route}}" title="{{.Local}}"></iframe>
  </section>
  {{- end}}
  {{- end}}
</main>

<script>
  // Give a tile focus when it is clicked, and show which one has it.
  //
  // The browser normally does this itself: a click inside a frame focuses that
  // frame. It does it as the default action of the mousedown, though, so an
  // origin that calls preventDefault on mousedown cancels the focus along with
  // whatever else it was suppressing. Plenty do — xpra's HTML5 client is the
  // one that surfaced this, forwarding the click to a remote desktop and
  // wanting none of the browser's own handling. Standalone that costs nothing,
  // because there is nothing else to focus. In a panel it means the tile can
  // never take the keyboard, and every keystroke keeps going to whichever tile
  // had it last, which reads as the wrong window being typed into.
  //
  // So the panel focuses the frame itself, in the capture phase, before the
  // origin's handler runs and regardless of what it does afterwards, and
  // marks the tile so its border goes white: a console's active pane, so a
  // keystroke's destination is never a guess. Every frame here is the
  // tunnel's own hostname, so reaching into one is same-origin and allowed;
  // the try/catch is for the case where it somehow is not, where the old
  // behaviour is the right thing to fall back to.
  //
  // On load rather than once, because a frame that navigates — an origin
  // redirecting, or reconnecting — replaces the window this was attached to.
  //
  // The same reach into the frame is what keeps a bare page legible. A page
  // with no CSS at all — a bare "hello", anything a stock dev server hands
  // out without a stylesheet — renders in the browser's light defaults:
  // black text on a canvas it never painted, which is the terminal's black
  // showing through. Telling that document it is dark switches the defaults
  // it was already using and nothing else. A page that chose anything — a
  // stylesheet, a style element, a style attribute, a color-scheme meta — is
  // left exactly as it is; its colours are its own.
  const tiles = [...document.querySelectorAll('.tile')];
  const activate = (tile) => {
    for (const t of tiles) t.classList.toggle('active', t === tile);
  };
  const paint = (frame) => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      if (doc.querySelector('meta[name="color-scheme"], style, link[rel~="stylesheet"], [style]')) return;
      doc.documentElement.style.colorScheme = 'dark';
    } catch (e) { /* cross-origin: its colours are its own */ }
  };
  for (const frame of document.querySelectorAll('.tile iframe')) {
    const tile = frame.closest('.tile');
    const wire = () => {
      try {
        frame.contentWindow.addEventListener(
          'pointerdown', () => { frame.contentWindow.focus(); activate(tile); }, true);
        frame.contentWindow.addEventListener('focus', () => activate(tile));
      } catch (e) { /* cross-origin: leave the browser's default alone */ }
      paint(frame);
    };
    frame.addEventListener('load', wire);
    wire(); // a frame that is already there when this runs
  }

  // The grid. A terminal tile's page says what its fit settled on — rows,
  // columns, the cell — on its document element; the panel takes the cell
  // from the first tile that has one and lays its own frames on it, so the
  // borders it draws and the borders the terminals draw share rows and
  // columns. Read again whenever a terminal loads or the page resizes, since
  // the fit runs then; a page with no terminal keeps the stylesheet's guess.
  const grid = () => {
    for (const frame of document.querySelectorAll('.tile.bare iframe')) {
      try {
        const d = frame.contentDocument.documentElement.dataset;
        if (d.cellH && d.cellW) {
          document.documentElement.style.setProperty('--row', d.cellH + 'px');
          document.documentElement.style.setProperty('--col', d.cellW + 'px');
          return;
        }
      } catch (e) { /* cross-origin, or not loaded yet */ }
    }
  };
  for (const frame of document.querySelectorAll('.tile.bare iframe')) {
    frame.addEventListener('load', () => { grid(); setTimeout(grid, 300); });
  }
  new ResizeObserver(() => setTimeout(grid, 100)).observe(document.body);
  grid();

  // Reload one frame. It reloads where it is, not back at the route it began
  // on: a page that navigated somewhere and stayed is what the tile shows,
  // and what is stale. A reload revalidates the document the way the
  // browser's own reload does; the browser scopes nothing harder to a frame,
  // and the page's subresources keep whatever caching it gave them, as they
  // would at the top level. A frame whose window cannot be read — it left the
  // origin — is pointed at its route again, which is all that can be done.
  const reload = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile && tile.querySelector('[data-reload]');
    if (button) button.classList.add('busy');
    const again = () => { frame.src = frame.getAttribute('src'); };
    let win, href;
    try { win = frame.contentWindow; href = win.location.href; } catch (e) { win = null; }
    if (!win || href === 'about:blank') return again();
    try { win.location.reload(); } catch (e) { again(); }
  };
  // Step one frame back — and only within that frame's own history. A
  // frame's history.back() walks the page's joint history, the same walk the
  // browser's back button takes, and with nothing of the frame's to step to
  // it leaves the panel instead: pressed on a fresh tile it lands the tab on
  // whatever came before. So the button only fires when the frame has an
  // entry of its own behind it, and is hidden the rest of the time: a tile
  // that has gone nowhere shows nothing to go back to.
  //
  // The Navigation API knows exactly that, per frame and pushState included.
  // Where it is missing the frame's loads are counted instead: one up per
  // load the button did not cause, one down per back. In-page routing goes
  // uncounted there, which leaves the button inert rather than wrong.
  const back = (frame) => {
    const tile = frame.closest('.tile');
    const button = tile.querySelector('[data-back]');
    let depth = 0;
    let expected = false; // the next load is one the button caused
    const can = () => {
      try {
        const nav = frame.contentWindow.navigation;
        return nav ? nav.canGoBack : depth > 0;
      } catch (e) { return false; }
    };
    const show = () => { button.hidden = !can(); };
    button.addEventListener('click', () => {
      if (!can()) return;
      expected = true;
      depth = Math.max(0, depth - 1);
      try { frame.contentWindow.history.back(); } catch (e) { expected = false; }
    });
    tile.querySelector('[data-reload]').addEventListener('click', () => { expected = true; });
    // A frame that finished loading before this ran has had its first load:
    // counting the next one as it would count a fresh page's first load
    // swallows a real step. One that cannot be read has certainly loaded.
    let first = true;
    try {
      const doc = frame.contentDocument;
      first = !(doc && doc.readyState === 'complete' && frame.contentWindow.location.href !== 'about:blank');
    } catch (e) { first = false; }
    frame.addEventListener('load', () => {
      if (first) first = false;
      else if (expected) expected = false;
      else depth++;
      try {
        frame.contentWindow.navigation?.addEventListener('currententrychange', show);
      } catch (e) { /* left the origin: nothing to count */ }
      show();
    });
    show();
  };
  for (const frame of document.querySelectorAll('.tile:not(.bare) iframe')) back(frame);
  for (const button of document.querySelectorAll('.tile [data-reload]')) {
    const frame = button.closest('.tile').querySelector('iframe');
    button.addEventListener('click', () => reload(frame));
    frame.addEventListener('load', () => button.classList.remove('busy'));
  }
</script>

</body>
</html>
