<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<!-- Named by the terminal itself once one is attached: the frame sets its
     window title, xterm raises it, and the handler below puts it here. Until
     then this is all there is to say. -->
<title>tunneld · attach</title>

<!-- xterm.js, pinned by version and checked by digest so a change at the CDN
     cannot silently alter what a tunnel serves. xterm 6 ships no .min. files;
     jsDelivr would minify on the fly for a .min.js URL, but the integrity hash
     has to match the bytes actually served, so these are the real paths. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
      integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD"
      crossorigin="anonymous"
      referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"
        integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"
        integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<!-- The WebGL renderer. Without it xterm draws every cell as text in a clipped
     row, which a terminal program's box drawing does not survive: at this font
     size U+2502 carries 16.5px of ink through a 15px row, so every vertical
     rule loses its ends once per row and reads as a dashed line, and a
     fractional cell advance (7.83px) puts each row's glyphs on different
     device pixels, so the columns furthest right stop lining up with each
     other. Neither is a font problem — it is what the DOM renderer is.

     With this loaded, xterm draws box-drawing and block characters itself,
     sized to the cell, which is what makes the lines continuous. Its own
     `customGlyphs` option says so, and says it "doesn't work with the DOM
     renderer". VS Code's terminal is the same library making the same choice:
     gpuAcceleration defaults to "auto", which loads this addon. -->
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"
        integrity="sha384-8/2DNT7OeuMQVc7wBPoMHAQ+NmEoYSx27k7IdbsItiomGC5D9+LTrbo8jtY6YZv8"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

<style>
  /* The terminal is the page. No chrome, no header, nothing to explain — what
     the container has to say is the only content, and anything framing it
     steals rows from a viewport that is often a phone. */
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: flex; flex-direction: column; position: relative; }
  #term { flex: 1; min-height: 0; width: 100%; }

  /* The one thing worth framing it for: what the container cannot do. That is
     a fact about how it was started — settled before the socket opened, and
     unchanged by anything printed after — so it belongs to the page rather
     than to the scrollback, where it would scroll away from the reader who
     needs it and reappear on every reconnect for the one who does not.
     Deliberately quiet: one line, small, grey on near-black with a hairline
     under it, so it reads as the window's edge and not as the container
     speaking. At this size it costs the terminal a row or two and nothing
     else, and when there is nothing to say the element is not rendered at all
     — no empty bar, no stray gap. */
  /* Shown over the terminal when the socket is gone, rather than written into
     it. A framed terminal is on the alternate screen and the frame owns every
     cell of it, so a line written there lands on top of whatever the container
     had drawn and stays there. Over the top, the last screen is left exactly
     as it was — dimmed, because it is a photograph now rather than a terminal
     — and nothing has to be undone to come back. */
  /* The origin, above what happened to it. The frame says the same thing in
     its top-left corner, and that corner is behind this overlay — so without
     it a page that has lost its socket stops naming what it was showing. */
  #where { color: #e8e8e8; }
  #why { color: #9a9a9a; }

  #gone[hidden] { display: none; }
  #gone {
    position: absolute;
    inset: 0;
    /* Above the terminal, which since the WebGL renderer is a stack of
       canvases carrying z-index of their own — the link layer sits at 2. An
       overlay with none of its own paints under them: it is visible, because
       the canvases are transparent where nothing is drawn, and its button is
       not clickable, because the canvas is what the click lands on. */
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.72);
    color: #cfcfcf;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #gone button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    padding: 5px 14px;
    cursor: pointer;
  }
  #gone button:hover { background: #1a1a1a; border-color: #5a5a5a; }

  .degraded {
    flex: none;
    font: 11px/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #7a7a7a;
    background: #0c0c0c;
    border-bottom: 1px solid #1e1e1e;
    padding: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
{{with .Notice}}<div class="degraded">{{.}}</div>{{end}}
<div id="term"></div>
<div id="gone" hidden>
  <span id="where">{{.Origin}}</span>
  <span id="why">detached</span>
  <button id="again" type="button">{{if .Restarts}}restart{{else}}reconnect{{end}}</button>
</div>
<script>
(() => {
  // The k8s remotecommand channels. The first byte of every binary frame says
  // which stream it belongs to, in both directions.
  const STDIN = 0, STDOUT = 1, STDERR = 2, ERROR = 3, RESIZE = 4;

  // convertEol unconditionally, because half the containers worth attaching to
  // have no line discipline behind them. Without a TTY nothing supplies the
  // carriage return: the container writes a bare \n, xterm does exactly what
  // it was told and feeds the line without returning the carriage, and the
  // output walks diagonally down the page. A real terminal never shows this
  // because the kernel's tty driver is doing ONLCR out of sight, and there is
  // no kernel anywhere in this path.
  //
  // Safe on a TTY too, which is why this needs no flag of its own. The option
  // rewrites no bytes and adds no line feed — it only makes the line-feed
  // handler set the cursor column to 0 as well — so on a stream that already
  // sends \r\n the column is simply set to 0 twice, and the row still advances
  // once. One setting covers both, and no second copy of "does this container
  // have a TTY" is left here to drift out of step with degraded().
  // linkHandler is what makes an OSC 8 hyperlink activate. xterm underlines
  // one without it, which is worse than not marking it at all: it looks like a
  // link and does nothing. The frame marks its own public address, so this is
  // the click that opens the tunnel in a tab of its own.
  //
  // noopener because the container's output reaches this terminal, and an
  // origin that printed its own OSC 8 could otherwise hand itself a handle on
  // this window.
  const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontSize: 13,
    linkHandler: {
      activate(event, uri) {
        event.preventDefault();
        window.open(uri, '_blank', 'noopener,noreferrer');
      },
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // The terminal names the tab it is displayed in. The frame sets its window
  // title to the origin and whatever the container is calling itself, the
  // renderer emits that as an OSC, and xterm hands it over here.
  //
  // Assigned to document.title, which is text and not markup — the string
  // comes from a program in somebody's container, and the only reason it is
  // safe to use is that nothing parses it.
  term.onTitleChange((title) => { document.title = title; });

  term.open(document.getElementById('term'));

  // Loaded after open, because the addon needs the element xterm attached to.
  //
  // Every failure here is survivable and none of them is worth a message: a
  // context this machine will not give, a driver that refuses, a GPU that
  // takes the context back later when the tab is buried or the laptop
  // switches cards. Dispose and the terminal falls back to the renderer it
  // would have had — dashed rules and all, which is a worse terminal and
  // still a terminal.
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
  } catch (e) {
    console.warn('attach: falling back to the DOM renderer', e);
  }

  fit.fit();

  // Typing should work without clicking first. Nothing else on the page wants
  // the keyboard, and every arrival here is somebody who came to use a
  // terminal — including the one who just pressed the overlay's button, whose
  // focus is on a button that this reload has now replaced.
  term.focus();

  // location.search is the tunnel's own bare routing parameter, carried over
  // verbatim: the page was served at /?1, so its socket goes to /attach?1 and
  // lands on the same origin. Leaning on the sticky origin cookie instead
  // would let a second tab's container steal this one's socket, and a
  // websocket handshake sends no Referer for the tunnel to route by.
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host + '/attach' + location.search,
                           ['v4.channel.k8s.io']);
  ws.binaryType = 'arraybuffer';

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  const send = (channel, bytes) => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const frame = new Uint8Array(bytes.length + 1);
    frame[0] = channel;
    frame.set(bytes, 1);
    ws.send(frame);
  };

  const sendSize = () => send(RESIZE, encoder.encode(
    JSON.stringify({ Width: term.cols, Height: term.rows })));

  ws.onmessage = (event) => {
    const frame = new Uint8Array(event.data);
    // A one-byte frame is the server saying the stream is established. There
    // is nothing to print, but it is the moment the terminal is really live,
    // so the first size goes out here rather than on open.
    if (frame.length < 2) {
      if (frame[0] === STDOUT) sendSize();
      return;
    }
    const body = frame.subarray(1);
    switch (frame[0]) {
      case STDOUT:
      case STDERR:
        term.write(body);
        break;
      case ERROR:
        // A v4 status: success carries no message worth showing, and a
        // failure is the only thing the reader can act on.
        try {
          const status = JSON.parse(decoder.decode(body));
          if (status.status !== 'Success') {
            gone(status.message || 'attach failed');
          }
        } catch { /* not JSON; nothing useful to show */ }
        break;
    }
  };

  // gone puts the overlay up, once. A failed attach is followed by the socket
  // closing, and of the two reasons the first is the one worth reading: the
  // second only says the connection went with it.
  const overlay = document.getElementById('gone'), why = document.getElementById('why');
  const again = document.getElementById('again');
  again.onclick = () => location.reload();
  // reason is what to say, or nothing to have the server asked. A socket
  // ending says nothing about why: this viewer's own connection dropping — a
  // lid, an idle timeout — leaves a terminal still running, and a container
  // whose shell exited leaves nothing at all, and both arrive here
  // identically.
  //
  // So the word starts as the half that is always true — your socket is gone,
  // whatever else is — and becomes "ended" when the answer says nothing can
  // bring it back. The button waits for that answer rather than appearing and
  // vanishing.
  const gone = (reason) => {
    if (!overlay.hidden) return;
    why.textContent = reason || 'detached';
    overlay.hidden = false;

    again.hidden = true;
    if (reason) return; // an explicit one is already the whole story
    fetch('/alive' + location.search, { cache: 'no-store' })
      .then((r) => {
        again.hidden = !r.ok;
        why.textContent = r.ok ? 'detached' : 'ended';
      })
      .catch(() => { why.textContent = 'ended'; });
  };

  term.onData((data) => send(STDIN, encoder.encode(data)));

  // The frame's own key, and the only one this page takes from the terminal:
  // Ctrl+K, on every platform.
  //
  // The page has to be in the way even though xterm would encode this key by
  // itself, because the browser claims it first — Ctrl+K opens the address bar
  // for a search — and a page that does not preventDefault loses the keystroke
  // before the terminal ever sees it. Sending the byte here rather than letting
  // xterm send it is what makes refusing the key and delivering it the same
  // decision.
  //
  // The byte is the one a terminal sends for Ctrl+K, so the frame's rule is
  // about a key rather than about a private signal, and a keystroke that
  // reaches xterm some other way still opens the commands.
  //
  // It costs the program a real key — Ctrl+K is kill-to-end-of-line in
  // readline, and bound in plenty of full-screen programs. That is the price
  // of the frame having a key at all, and it is cheaper than the price of
  // taking Ctrl-D, which ends a shared session for everybody.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown' || e.key !== 'k') return true;
    if (!e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return true;
    e.preventDefault();
    send(STDIN, encoder.encode('\x0b'));
    return false;
  });

  new ResizeObserver(() => { fit.fit(); sendSize(); }).observe(document.body);

  // Cloudflare closes idle websockets and a page cannot send a websocket ping,
  // so the terminal's own size doubles as the heartbeat: resizing to the
  // dimensions already in effect is a no-op on the container.
  const beat = setInterval(sendSize, 30000);

  ws.onclose = () => {
    clearInterval(beat);
    gone();
  };
})();
</script>
</body>
</html>
