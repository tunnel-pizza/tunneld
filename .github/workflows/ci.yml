name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Defaults are [opened, synchronize, reopened]. Add ready_for_review
    # so a draft -> ready transition re-runs CI without an empty push;
    # keep synchronize explicit so every new commit on the PR triggers a
    # fresh run.
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual run from main releases the way a push does, with the npm
  # dist-tag chosen up front. A push always publishes to latest.
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag for this release
        type: choice
        options: [latest, beta]
        default: latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 + arm64 across linux, windows, and macos, all pinned to discrete
        # image labels (no *-latest aliases) so every cell names an explicit
        # version — the GitHub-hosted ARM runners (free for public repos) only
        # exist as discrete labels, so pinning the rest keeps the matrix
        # consistent. macos-26-intel is x64 (Intel), macos-26 is arm64 (Apple
        # Silicon). Bumping an image label renames its check context, so update
        # the branch-protection required contexts when bumping. gofmt runs
        # Linux-only (see below), covering both Linux cells.
        os:
          - ubuntu-24.04
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-26-intel
          - macos-26
        # Whatever setup-go's `stable` alias resolves to. Single-valued, but
        # kept as a matrix dimension: it keeps the check context names
        # (`ci (<os>, stable)`) stable, and another version can be added here
        # without renaming every existing one — a rename means updating the
        # branch-protection required contexts.
        go: [stable]
    defaults:
      run:
        # bash on Windows runners comes from git-for-windows (MSYS) and matches
        # the Linux job's shell semantics, so steps below don't need per-OS
        # branching for $(...) / [ -n ... ] / piping.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        # Linux-only: actions/checkout on Windows normalizes line endings to
        # CRLF, which gofmt flags on every file. The Linux cells already
        # enforce gofmt on the canonical LF tree.
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The make targets export CGO_ENABLED=0 (see Makefile) — the library is
      # pure Go, and windows-11-arm runners ship an x86_64 gcc that can't
      # assemble runtime/cgo's arm64 stubs.
      - name: go vet
        run: make vet

      - name: go build
        run: make build

      - name: tests
        run: make test

      # ACTIONS_RUNTIME_TOKEN is the runner's own credential and the last thing
      # the github identity provider looks for, so a mint from CI is
      # authenticated rather than anonymous. It is ambient on GitHub-hosted
      # runners and e2e's strippedEnv deliberately passes it through, so
      # nothing here needs to set it — and nothing here may: it is not in the
      # env context, so naming it in an env: block would resolve to empty and
      # overwrite the value it was meant to forward.
      #
      # Reported present or absent, never printed, so a runner that stops
      # exporting it to run steps shows up as a line here rather than as a
      # silently anonymous mint.
      - name: e2e
        run: |
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:+present}${ACTIONS_RUNTIME_TOKEN:-absent}"
          make e2e

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: race tests
        # The make target owns the lane's definition (CGO on for the detector,
        # which the matrix above can't provide — it forces CGO off for
        # cross-host determinism), so a CI race find reproduces locally with
        # the same command.
        run: make race

  # The release's version is decided once, here, and read by both the job that
  # stamps it into the binaries and the job that publishes them. Its own job
  # rather than a step of release so the binaries can be built — and fail —
  # before any tag is pushed or release created. Resolves only; the push is
  # release's, after the build has succeeded.
  tag:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      needs_push: ${{ steps.tag.outputs.needs_push }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: resolve tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag push (minor/major bumps): use the tag as-is.
            {
              echo "tag=${GITHUB_REF_NAME}"
              echo "needs_push=false"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main push, or a manual run from main: skip release if the commit
          # opted out or already has a tag.
          # Token must sit alone on its own line so prose mentioning it inline
          # (subjects, doc paragraphs) doesn't accidentally suppress the release.
          msg=$(git log -1 --pretty=%B)
          if grep -qE '^[[:space:]]*\[skip release\][[:space:]]*$' <<<"$msg"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Auto-bump patch from the latest v* tag (default v0.0.1 for first release).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          {
            echo "tag=${next}"
            echo "needs_push=true"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

  # The six platform binaries, cross-compiled once and handed to release as an
  # artifact. Its own job so a build that fails is a failed build under its own
  # name, and so release — which needs it — never pushes a tag or opens a
  # release for bytes that do not exist. Not run on pull requests: the ci
  # matrix above already builds every one of these GOOS/GOARCH pairs natively,
  # so a cross-compile break is caught there, on every PR.
  #
  # Pure Go with CGO off and -trimpath, so a cross-compile on one Linux runner
  # gives the same bytes a native build would; six of them take about a minute.
  binaries:
    needs: [tag]
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build binaries
        run: make binaries VERSION=${{ needs.tag.outputs.tag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Skipped whenever tag says skip: binaries is skipped then, and a job that
  # needs a skipped job is skipped with it. So every step below runs, or none.
  release:
    needs: [ci, race, tag, binaries]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag + create release
      packages: write   # push the container image to ghcr
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binaries the release ships, built and stamped by the job above.
      # Everything below signs, uploads and publishes these exact bytes.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: push tag
        if: needs.tag.outputs.needs_push == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${{ needs.tag.outputs.tag }}"
          git push origin "${{ needs.tag.outputs.tag }}"

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.tag.outputs.tag }}" \
            --title "${{ needs.tag.outputs.tag }}" \
            --generate-notes

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"
          mkdir -p dist

          # Pull the auto-generated source archives that GitHub publishes
          # alongside every tag, then sign them with cosign in keyless mode
          # (OIDC -> Fulcio cert -> Rekor transparency log). The signature,
          # cert, and Rekor entry are bundled in a single .sigstore file.
          for ext in tar.gz zip; do
            curl -fsSL "https://github.com/${repo}/archive/refs/tags/${tag}.${ext}" \
              -o "dist/${tag}.${ext}"
            cosign sign-blob --yes \
              --bundle "dist/${tag}.${ext}.sigstore" \
              "dist/${tag}.${ext}"
          done

          # The binaries the same way — one bundle each, and a checksum file
          # with a bundle of its own for anyone who verifies once and then
          # trusts sha256sum. Windows executables are cosign-signed like the
          # rest, not Authenticode-signed; SECURITY.md says so.
          #
          # The glob is expanded before the loop runs, so the bundles it
          # writes are not themselves signed on the same pass.
          (cd dist && sha256sum tunneld-* > checksums.txt)
          for f in dist/tunneld-* dist/checksums.txt; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "${f}"
          done

          # dist/tunneld-* now matches each binary and its bundle. The source
          # archives themselves are not uploaded: GitHub serves those.
          gh release upload "${tag}" \
            dist/tunneld-* \
            dist/checksums.txt dist/checksums.txt.sigstore \
            "dist/${tag}.tar.gz.sigstore" \
            "dist/${tag}.zip.sigstore"

      # The image is the same artifact as the binary, built from the same
      # commit and stamped with the same tag, so `tunneld version` inside a
      # container names the release it came from.
      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the Dockerfile builds on BUILDPLATFORM and lets Go
      # cross-compile to TARGETARCH, so both arches are native compiles.
      - name: build and push the image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed by digest, not by tag: a tag can be moved to point at other
      # bytes, and a signature that follows it would vouch for whatever it
      # moved to. Verify with:
      #   cosign verify ghcr.io/tunnel-pizza/tunneld:<tag> \
      #     --certificate-identity-regexp '^https://github.com/tunnel-pizza/tunneld/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: sign the image
        run: |
          cosign sign --yes \
            "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: warm proxy.golang.org
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          mod="github.com/${GITHUB_REPOSITORY}"
          curl -fsSL "https://proxy.golang.org/${mod}/@v/${tag}.info" >/dev/null
          curl -fsSL "https://proxy.golang.org/${mod}/@v/${tag}.mod"  >/dev/null
          curl -fsSL "https://sum.golang.org/lookup/${mod}@${tag}"    >/dev/null

      # The npm package carries the binaries already in dist/, so this job
      # needs no Go toolchain. Last in the job so a registry failure never
      # gates the image or the signatures.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Auth is npm trusted publishing (OIDC through id-token: write above),
      # configured on the package's npmjs.com settings for this repo and this
      # workflow file; no token secret. That also produces the provenance
      # attestation.
      #
      # The committed package.json says 0.0.0 the way the Go module carries no
      # version: the tag is the release. npm version rewrites it in place for
      # this publish and nothing is committed.
      #
      # --ignore-scripts, so prepublishOnly does not rebuild dist/: the package
      # packs the bytes the binaries job built and this job signed, by
      # construction rather than by the argument that a -trimpath rebuild with
      # the same VERSION would be identical. prepublishOnly stays in
      # package.json for a publish run by hand, where there is no artifact.
      #
      # A release publishes to latest. A manual run of this workflow from main
      # can choose beta instead (the dist_tag input); a push carries no input
      # and the fallback applies. Promote a beta without a rebuild:
      #   npm dist-tag add tunneld@<version> latest
      - name: publish to npm
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          npm version "${tag#v}" --no-git-tag-version
          npm publish --ignore-scripts --tag "${{ inputs.dist_tag || 'latest' }}" --provenance
