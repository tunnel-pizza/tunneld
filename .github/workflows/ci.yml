name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Defaults are [opened, synchronize, reopened]. Add ready_for_review
    # so a draft -> ready transition re-runs CI without an empty push;
    # keep synchronize explicit so every new commit on the PR triggers a
    # fresh run.
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual run from main releases the way a push does, with the npm
  # dist-tag chosen up front. A push always publishes to latest.
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag for this release
        type: choice
        options: [latest, beta]
        default: latest

# id-token is what cosign's keyless signing exchanges for a certificate. It is
# granted here for the whole workflow, and GitHub still withholds it on two
# kinds of pull request — a fork's, and dependabot's — so the steps that need
# it check tag's `signed` output and skip there. A job that declares its own
# permissions replaces this block for that job, so those restate it.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 + arm64 across linux, windows, and macos, all pinned to discrete
        # image labels (no *-latest aliases) so every cell names an explicit
        # version — the GitHub-hosted ARM runners (free for public repos) only
        # exist as discrete labels, so pinning the rest keeps the matrix
        # consistent. macos-26-intel is x64 (Intel), macos-26 is arm64 (Apple
        # Silicon). Bumping an image label renames its check context, so update
        # the branch-protection required contexts when bumping. gofmt runs
        # Linux-only (see below), covering both Linux cells.
        os:
          - ubuntu-24.04
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-26-intel
          - macos-26
        # Whatever setup-go's `stable` alias resolves to. Single-valued, but
        # kept as a matrix dimension: it keeps the check context names
        # (`ci (<os>, stable)`) stable, and another version can be added here
        # without renaming every existing one — a rename means updating the
        # branch-protection required contexts.
        go: [stable]
    defaults:
      run:
        # bash on Windows runners comes from git-for-windows (MSYS) and matches
        # the Linux job's shell semantics, so steps below don't need per-OS
        # branching for $(...) / [ -n ... ] / piping.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        # Linux-only: actions/checkout on Windows normalizes line endings to
        # CRLF, which gofmt flags on every file. The Linux cells already
        # enforce gofmt on the canonical LF tree.
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The make targets export CGO_ENABLED=0 (see Makefile) — the library is
      # pure Go, and windows-11-arm runners ship an x86_64 gcc that can't
      # assemble runtime/cgo's arm64 stubs.
      - name: go vet
        run: make vet

      - name: go build
        run: make build

      - name: tests
        run: make test

      # ACTIONS_RUNTIME_TOKEN is the runner's own credential and the last thing
      # the github identity provider looks for, so a mint from CI is
      # authenticated rather than anonymous. It is ambient on GitHub-hosted
      # runners and e2e's strippedEnv deliberately passes it through, so
      # nothing here needs to set it — and nothing here may: it is not in the
      # env context, so naming it in an env: block would resolve to empty and
      # overwrite the value it was meant to forward.
      #
      # Reported present or absent, never printed, so a runner that stops
      # exporting it to run steps shows up as a line here rather than as a
      # silently anonymous mint.
      - name: e2e
        run: |
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:+present}${ACTIONS_RUNTIME_TOKEN:-absent}"
          make e2e

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: race tests
        # The make target owns the lane's definition (CGO on for the detector,
        # which the matrix above can't provide — it forces CGO off for
        # cross-host determinism), so a CI race find reproduces locally with
        # the same command.
        run: make race

  # The version is decided once, here, and read by the jobs that stamp it into
  # the binaries and the image and by the job that publishes them. Its own job
  # rather than a step of release so the builds can run — and fail — before
  # any tag is pushed or release created. Resolves only; the push is release's.
  #
  # It runs on every event, because binaries and image do: a pull request gets
  # a throwaway version and release=false, so the same build and artifact
  # steps that a release will use are exercised on every PR, and only the
  # publishing is held back.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      needs_push: ${{ steps.tag.outputs.needs_push }}
      release: ${{ steps.tag.outputs.release }}
      # Whether this run's token can sign and push: GitHub issues no OIDC
      # token and a read-only GITHUB_TOKEN to a pull request from a fork or
      # from dependabot, whatever permissions ask for. Decided once, here, so
      # every step that needs the token asks the same question.
      signed: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: resolve tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # A pull request builds under a version that names it and never
          # releases. A prerelease shape, so nothing sorts it above a release.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            {
              echo "tag=v0.0.0-pr${PR_NUMBER}.${GITHUB_SHA:0:7}"
              echo "needs_push=false"
              echo "release=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag push (minor/major bumps): use the tag as-is.
            {
              echo "tag=${GITHUB_REF_NAME}"
              echo "needs_push=false"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main push, or a manual run from main: no release if the commit
          # opted out or already has a tag — the builds still run, under the
          # version they would have had, so a build break is caught either way.
          # Token must sit alone on its own line so prose mentioning it inline
          # (subjects, doc paragraphs) doesn't accidentally suppress the release.
          msg=$(git log -1 --pretty=%B)
          release=true
          if grep -qE '^[[:space:]]*\[skip release\][[:space:]]*$' <<<"$msg"; then
            release=false
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            release=false
          fi

          # Auto-bump patch from the latest v* tag (default v0.0.1 for first release).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          {
            echo "tag=${next}"
            echo "needs_push=${release}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  # One binary per cell, six cells, cross-compiled on Linux — pure Go with CGO
  # off and -trimpath, so a cross-compile gives the same bytes a native build
  # would. The Makefile's PLATFORMS list is the source of truth for names; each
  # cell runs the same target with that list narrowed to itself. Its own job so a build
  # that fails is a failed build under its own name, and so release — which
  # needs every cell — never pushes a tag or opens a release for bytes that do
  # not exist. Run on pull requests too, under a throwaway version, so the
  # build and the artifact hand-off are exercised before a merge rather than
  # discovered by the release that needs them.
  #
  # Each cell also signs its binary. A cosign blob signature depends on the
  # bytes and on this workflow's identity, not on any tag, so it can be made
  # here before a tag exists — and then release uploads exactly what was
  # signed, with nothing between the build and the signature. Signing is the
  # one step that skips on a pull request whose token gets no OIDC — a fork's,
  # or dependabot's; those still build and upload.
  binaries:
    needs: [tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
          - win32-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The Makefile's own target with its platform list narrowed to this
      # cell: it derives the file name (win32 carries .exe) and wipes dist/
      # first, so dist/ holds exactly this one binary afterwards.
      - name: build
        run: make binaries VERSION=${{ needs.tag.outputs.tag }} PLATFORMS=${{ matrix.platform }}

      - name: install cosign
        if: needs.tag.outputs.signed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: OIDC -> Fulcio cert -> Rekor transparency log, bundled in one
      # .sigstore file beside the binary. Windows executables are cosign-signed
      # like the rest, not Authenticode-signed; SECURITY.md says so.
      - name: sign
        if: needs.tag.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for f in dist/tunneld-*; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "${f}"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # One image per architecture, pushed by digest only — no tag, not even a
  # temporary one — and signed by that digest, all before any release tag
  # exists. The version is still stamped inside, so `tunneld version` in the
  # container names the release; what is not yet public is the name. release
  # tags the digests once the tag is pushed, which puts the image on the same
  # footing as the binaries: an image that fails to build fails here, under its
  # own name, and leaves no tag pushed and no release opened.
  #
  # No QEMU: the Dockerfile builds on BUILDPLATFORM and lets Go cross-compile
  # to TARGETARCH, so each cell is a native compile. A release that fails after
  # this job leaves two untagged manifests in ghcr — invisible to a pull, and
  # the same class of leftover as a failed run's artifacts.
  #
  # Every run builds the same way, pull requests included, and a run whose
  # token can push does: a digest that never gets a tag is an untagged
  # manifest in ghcr, invisible to a pull, and the price of every PR
  # exercising the exact steps a release will run. A PR whose token cannot
  # push or sign — a fork's, or dependabot's — builds into the cache and stops
  # there; the steps that need the token skip.
  image:
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr
      id-token: write   # restated: a job's own block replaces the workflow's
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to ghcr
        if: needs.tag.outputs.signed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest when the token allows; otherwise the same build goes
      # no further than the layer cache, which is still the Dockerfile
      # exercised end to end.
      - name: build and push by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.tag.outputs.tag }}
          outputs: ${{ needs.tag.outputs.signed == 'true' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: install cosign
        if: needs.tag.outputs.signed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, not by tag: a tag can be moved to point at other
      # bytes, and a signature that followed it would vouch for whatever it
      # moved to. There is no tag yet anyway. Verify with:
      #   cosign verify ghcr.io/tunnel-pizza/tunneld:<tag> \
      #     --certificate-identity-regexp '^https://github.com/tunnel-pizza/tunneld/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: sign the image by digest
        if: needs.tag.outputs.signed == 'true'
        run: |
          cosign sign --yes \
            "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.image.outputs.digest }}"

      # The digest is all release needs from this cell: it tags what is
      # already there rather than building anything again.
      - name: record the digest
        if: needs.tag.outputs.signed == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.image.outputs.digest }}" > "digests/linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.tag.outputs.signed == 'true'
        with:
          name: digest-linux-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  # The one job that is gated: it runs only when tag said this run releases —
  # a push to main without [skip release] and without a tag already on the
  # commit, a v* tag pushed by hand, or a manual run from main. Everything
  # before it ran regardless. Everything here is publishing: the bytes and
  # their signatures already exist, and this job is what gives them a name.
  release:
    needs: [ci, race, tag, binaries, image]
    if: >-
      needs.tag.outputs.release == 'true'
      && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag + create release
      packages: write   # tag the image in ghcr
      id-token: write   # restated: a job's own block replaces the workflow's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The six binaries and their bundles, one artifact per cell, merged back
      # into the dist/ the npm package packs. Everything below uploads and
      # publishes these exact bytes.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # upload-artifact zips what it is handed and that zip carries no mode
      # bits, so the binaries the build wrote 0755 arrive here 0644. npm packs
      # a file with the mode it has and the launcher spawns the binary rather
      # than reading it, so a lost bit installs cleanly and then fails on the
      # first run with EACCES. Nothing downstream restores it: npm chmods the
      # package's bin entry, which is the launcher, not what dist/ holds.
      #
      # Mode is not part of what cosign signed or what sha256sum hashes — the
      # bytes are the same either side of this. The binaries only: their
      # bundles sit beside them under the same prefix and are not programs.
      # A dist/ without binaries in it fails here rather than publishing six
      # unrunnable files.
      - name: restore the executable bit
        run: |
          set -euo pipefail
          n=0
          for f in dist/tunneld-*; do
            case "$f" in *.sigstore) ;; *) chmod +x "$f"; n=$((n + 1)) ;; esac
          done
          test "$n" -eq 6

      - name: push tag
        if: needs.tag.outputs.needs_push == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${{ needs.tag.outputs.tag }}"
          git push origin "${{ needs.tag.outputs.tag }}"

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.tag.outputs.tag }}" \
            --title "${{ needs.tag.outputs.tag }}" \
            --generate-notes

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Two things can only be signed here. The source archives, because
      # GitHub generates them once the tag exists. And checksums.txt, because
      # it covers all six binaries and no cell had more than one — signed so
      # anyone who verifies once can then trust sha256sum. The binaries were
      # signed where they were built; their bundles are already in dist/.
      - name: sign the rest and upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"

          for ext in tar.gz zip; do
            curl -fsSL "https://github.com/${repo}/archive/refs/tags/${tag}.${ext}" \
              -o "dist/${tag}.${ext}"
            cosign sign-blob --yes \
              --bundle "dist/${tag}.${ext}.sigstore" \
              "dist/${tag}.${ext}"
          done

          # The binaries only: dist/tunneld-* also matches their bundles now.
          (cd dist && for f in tunneld-*; do
            case "$f" in *.sigstore) ;; *) sha256sum "$f" ;; esac
          done > checksums.txt)
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore dist/checksums.txt

          # The source archives themselves are not uploaded: GitHub serves those.
          gh release upload "${tag}" \
            dist/tunneld-* \
            dist/checksums.txt dist/checksums.txt.sigstore \
            "dist/${tag}.tar.gz.sigstore" \
            "dist/${tag}.zip.sigstore"

      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image was built and signed per architecture before the tag
      # existed; this gives those digests their names. imagetools create
      # writes a manifest list pointing at the two manifests already in the
      # registry — nothing is rebuilt or re-pushed — under the release tag and
      # latest. The list gets a digest of its own, signed here the same way,
      # so verifying by tag lands on a signed index whose members are signed.
      - name: tag the image
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          image="ghcr.io/${GITHUB_REPOSITORY}"
          refs=()
          for d in digests/*; do refs+=("${image}@$(cat "$d")"); done
          docker buildx imagetools create \
            -t "${image}:${tag}" -t "${image}:latest" \
            "${refs[@]}"
          # The json form: the bare field prints the whole default view on
          # some buildx versions, checked against v0.32.
          digest=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "${image}@${digest}"

      - name: warm proxy.golang.org
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          mod="github.com/${GITHUB_REPOSITORY}"
          curl -fsSL "https://proxy.golang.org/${mod}/@v/${tag}.info" >/dev/null
          curl -fsSL "https://proxy.golang.org/${mod}/@v/${tag}.mod"  >/dev/null
          curl -fsSL "https://sum.golang.org/lookup/${mod}@${tag}"    >/dev/null

      # The npm package carries the binaries already in dist/, so this job
      # needs no Go toolchain. Last in the job so a registry failure never
      # gates the image or the signatures.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Auth is npm trusted publishing (OIDC through id-token: write above),
      # configured on the package's npmjs.com settings for this repo and this
      # workflow file; no token secret. That also produces the provenance
      # attestation.
      #
      # The committed package.json says 0.0.0 the way the Go module carries no
      # version: the tag is the release. npm version rewrites it in place for
      # this publish and nothing is committed.
      #
      # --ignore-scripts, so prepublishOnly does not rebuild dist/: the package
      # packs the bytes the binaries job built and this job signed, by
      # construction rather than by the argument that a -trimpath rebuild with
      # the same VERSION would be identical. prepublishOnly stays in
      # package.json for a publish run by hand, where there is no artifact.
      #
      # A release publishes to latest. A manual run of this workflow from main
      # can choose beta instead (the dist_tag input); a push carries no input
      # and the fallback applies. Promote a beta without a rebuild:
      #   npm dist-tag add tunneld@<version> latest
      - name: publish to npm
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          npm version "${tag#v}" --no-git-tag-version
          npm publish --ignore-scripts --tag "${{ inputs.dist_tag || 'latest' }}" --provenance
