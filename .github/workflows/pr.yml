name: PR

# The light check for a pull request stacked on another branch. ci.yml runs
# only for pull requests into main, where its matrix, builds and signing are
# what a merge needs; a stacked one gets this instead: gofmt, vet and the
# unit tests on one Linux runner. Nothing here is a required check, since
# branch protection guards main alone. A stacked PR gets ci.yml in full once
# it is retargeted onto main and its rebase is pushed.
on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: make vet

      # make test runs the npm launcher's tests too, on the Node ci.yml uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: unit
        run: make test
